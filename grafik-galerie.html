<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel-Grafiken 64 px</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3efe6;--fg:#2a2630;--cell:#e3dccb;--line:#9a8f78;--mut:#6b6455}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151b;--fg:#e8e0d0;--cell:#221f28;--line:#5a5266;--mut:#9a92a6}}
:root[data-theme="dark"]{--bg:#17151b;--fg:#e8e0d0;--cell:#221f28;--line:#5a5266;--mut:#9a92a6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.4 Georgia,'Times New Roman',serif}
h1{font-size:22px;margin:0 0 4px}
p.s{margin:0 0 12px;color:var(--mut);font-size:13px}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--cell);color:var(--fg);border-radius:6px}
h2{font-size:17px;margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-size:12px;color:var(--mut);font-weight:normal}
.g{display:grid;grid-template-columns:repeat(auto-fill,64px);gap:8px}
.c{width:64px;height:64px;outline:1px dashed var(--line);background:var(--cell)}
canvas{display:block;width:64px;height:64px;image-rendering:pixelated;cursor:pointer}
body.leer canvas{visibility:hidden}
</style>
</head>
<body>
<h1>Pixel-Grafiken 64 px</h1>
<p class="s">9 Kategorien × 20 Felder à 64×64 px. Tippen auf eine Grafik lädt sie als PNG.</p>
<button id="t">Nur leeres Gitter zeigen</button>
<div id="app"></div>
<script>
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const BG='#26232b';
const T=[['#4a5d2e','#37451f','#6b8040'],['#5a4330','#44301f','#7a5a40'],['#6b6b70','#4d4d52','#8a8a90'],['#b09a6a','#8f7a4e','#cdb98a'],['#dfe6ea','#b9c6cf','#ffffff'],['#3d3226','#2a2118','#54452f'],['#55603a','#3a4427','#788a4c'],['#2e2e33','#1f1f23','#45454c'],['#7a3a2a','#5a281c','#9a5238'],['#4b5a5e','#36434a','#68797e']];
const M=[['#6b6b70','#4d4d52','#8a8a90'],['#7a5a3a','#57402a','#9a7650'],['#8a4b3a','#623124','#a9614c'],['#4a4a55','#33333c','#66667a'],['#a89a78','#867a5a','#c8bc98']];
const W=[['#2e5a7a','#22445c','#5a8fb0'],['#1c3550','#122338','#2e5a7a'],['#a8d4e6','#7fb3cc','#e8f6fb'],['#3c4a2e','#2b3620','#5e7040'],['#3a8a4a','#2a6636','#7acc80']];
const Wd=[['#7a5a3a','#57402a','#9a7650','#8a3a3a'],['#5a4030','#3e2b20','#7a5a44','#3a5a8a'],['#a07848','#7a5a34','#c09a66','#4a6a3a'],['#3f3a44','#2b2830','#5a5462','#6a4a7a']];
const SK=['#e0b08a','#c68e63','#8a5a3c','#f0cfa8'],CL=['#3a5a8a','#8a3a3a','#4a6a3a','#6a4a7a','#8a7a3a'],HR=['#2a1f18','#6a4a2a','#c8b070','#8a8a90','#a04a2a'];
const RF=['#8a3a2a','#3f4f6a','#5a5a60','#6a4a2a'],WL=['#b0a080','#8a7a60','#9a9a9a','#7a5a3a','#c8bc98'];
const CN=[['#3a6a30','#2a4f24'],['#4a7a3a','#37602c'],['#6a7a2a','#4f5c1e'],['#8a4a2a','#66351e'],['#4a5a6a','#36444f']];
const PT=[['#7a5a3a','#57402a','#9a7650'],['#5a4030','#3e2b20','#7a5a44'],['#6b6b70','#4d4d52','#8a8a90'],['#8a4b3a','#623124','#a9614c']];
const B=[['#d4b04a','#8a6d22'],['#c0c4cc','#7a7e88'],['#b0743a','#6e4622'],['#b04040','#6e2626'],['#4a7ab0','#2e4c70']];
const PN='#2a2630',DK='#1c1a1f',TR='#57402a';

const CATS=[
['Boden',79,(p,i,r)=>{const t=T[i%10];p(0,0,t[0],16,16);for(let k=0;k<26;k++)p(r()*16|0,r()*16|0,r()<.5?t[1]:t[2]);if(i>=10)for(let y=0;y<16;y+=5){p(0,y,t[1],16,1);for(let x=(y/5%2)*3;x<16;x+=6)p(x,y,t[1],1,5)}}],
['Bauteile',28,(p,i)=>{const[b,d,l]=M[i/4|0],s=i%4;
 if(s==0){p(0,0,b,16,16);for(let y=0;y<16;y+=4){p(0,y+3,d,16,1);for(let x=(y/4%2)*4;x<16;x+=8)p(x,y,d,1,3);p(0,y,l,16,1)}}
 else if(s==1){p(0,0,b,16,16);for(let x=0;x<16;x+=4){p(x,0,d,1,16);p(x+1,0,l,1,16)}}
 else if(s==2){p(0,0,DK,16,16);p(5,0,b,6,16);p(5,0,l,1,16);p(10,0,d,1,16);p(7,2,d);p(7,13,d)}
 else{p(0,0,d,16,16);p(2,2,b,12,12);p(4,4,'#1a2230',8,8);p(4,4,'#3a5470',3,3);p(7,4,b,2,8);p(4,7,b,8,2)}}],
['Wasser',64,(p,i,r)=>{const[b,d,l]=W[i/4|0],s=i%4;p(0,0,b,16,16);
 if(s==0)for(let y=1;y<16;y+=4)for(let x=0;x<16;x++)if((x+y*2+i)%8<3)p(x,y,l);
 else if(s==1){for(let y=0;y<16;y++)for(let x=0;x<16;x++){const q=Math.hypot(x-7.5,y-7.5);if(q>2&&q<3||q>5&&q<6.2)p(x,y,l)}}
 else if(s==2){for(let x=0;x<16;x++)p(x,0,l,1,2+(r()*3|0));for(let k=0;k<8;k++)p(r()*16|0,4+r()*11|0,d)}
 else{p(0,0,d,16,16);for(let k=0;k<7;k++)p(r()*16|0,r()*16|0,l)}}],
['Möbel',61,(p,i,r)=>{const[b,d,l,a]=Wd[i/5|0],s=i%5;
 if(s==0){p(2,6,b,12,3);p(2,6,l,12,1);p(3,9,d,2,5);p(11,9,d,2,5)}
 else if(s==1){p(4,2,b,8,5);p(4,2,l,8,1);p(3,8,l,10,2);p(3,10,d,2,4);p(11,10,d,2,4)}
 else if(s==2){p(1,6,d,14,8);p(2,7,'#c8c0b0',12,5);p(2,7,'#e8e0d0',4,3);p(7,7,a,7,5)}
 else if(s==3){p(2,6,b,12,8);p(2,5,l,12,3);p(2,10,d,12,1);p(7,8,'#d4b04a',2,2)}
 else{p(2,1,d,12,14);p(3,2,DK,10,12);for(const y of[2,6,10]){p(3,y+3,b,10,1);for(let x=3;x<13;x++)if(r()<.7)p(x,y+1,CL[r()*5|0],1,2)}}}],
['Figuren',116,(p,i,r)=>{const sk=SK[i%4],c=CL[i/4|0],h=HR[r()*5|0];
 p(6,2,sk,4,4);p(6,2,h,4,1);p(5,3,h,1,2);p(7,4,'#111');p(9,4,'#111');
 p(5,6,c,6,5);p(4,6,c,1,4);p(11,6,c,1,4);p(4,10,sk);p(11,10,sk);p(5,9,'#33231a',6,1);p(6,11,'#33303a',2,4);p(8,11,'#33303a',2,4);
 if(i%3==0){p(5,1,TR,6,1);p(6,0,TR,4,1)}}],
['Gebäude',13,(p,i)=>{const rf=RF[i%4],w=WL[i/4|0];p(2,7,w,12,8);
 for(let y=2;y<=6;y++)p(8-(y-1),y,rf,2*(y-1),1);p(2,6,rf,12,1);p(2,7,'rgba(0,0,0,.3)',12,1);
 p(7,11,'#3e2b20',3,4);const wn=i%2?'#e8c860':'#1a2230';p(4,9,wn,2,2);p(10,9,wn,2,2);if(i%3==0)p(11,1,'#4d4d52',2,4)}],
['Bäume',10,(p,i)=>{const[c0,c1]=CN[i/4|0],s=i%4;
 if(s==0){p(7,9,TR,2,6);for(let y=1;y<11;y++)for(let x=2;x<14;x++)if((x-7.5)**2/30+(y-5.5)**2/20<1)p(x,y,(x-7.5)+(y-5.5)>3?c1:c0)}
 else if(s==1){p(7,11,TR,2,4);for(let k=0;k<3;k++)for(let j=0;j<4;j++){const w=2+j*2+k;p(8-w/2|0,1+k*3+j,j>2?c1:c0,w,1)}}
 else if(s==2){p(7,4,'#4a3a2e',2,11);p(4,5,'#4a3a2e',3,1);p(4,4,'#4a3a2e',1,2);p(9,7,'#4a3a2e',3,1);p(11,5,'#4a3a2e',1,3);p(6,2,'#4a3a2e',1,3)}
 else{for(let y=7;y<15;y++)for(let x=1;x<15;x++)if((x-7.5)**2/45+(y-11)**2/16<1)p(x,y,y>11?c1:c0);p(7,14,TR,2,1)}}],
['Props',59,(p,i)=>{const[b,d,l]=PT[i/5|0],s=i%5;
 if(s==0){p(4,3,b,8,11);p(5,2,b,6,1);p(4,5,d,8,1);p(4,11,d,8,1);p(4,3,l,1,11)}
 else if(s==1){p(3,4,b,10,10);p(3,4,d,10,1);p(3,13,d,10,1);p(3,4,d,1,10);p(12,4,d,1,10);for(let k=0;k<8;k++)p(4+k,5+k,d)}
 else if(s==2){p(7,8,TR,2,7);p(6,7,d,4,1);p(6,3,'#e8a030',4,4);p(7,2,'#f0d060',2,3)}
 else if(s==3){p(7,8,TR,2,7);p(3,3,b,10,5);p(3,3,l,10,1);p(4,5,d,8,1);p(4,6,d,6,1)}
 else{p(5,6,b,6,7);p(4,5,l,8,2);p(6,13,d,4,1);p(5,6,d,1,7)}}],
['Oberfläche',43,(p,i)=>{const[c,d]=B[i/4|0],s=i%4,o=(a,b,w,h,k)=>{p(a,b,k,w,1);p(a,b+h-1,k,w,1);p(a,b,k,1,h);p(a+w-1,b,k,1,h)};
 if(s==0){p(0,0,PN,16,16);o(0,0,16,16,c);o(1,1,14,14,d)}
 else if(s==1){p(0,0,PN,16,16);o(0,0,16,16,c);o(3,3,10,10,c)}
 else if(s==2){p(0,0,DK,16,16);p(1,1,PN,14,14);o(1,1,14,14,d);p(0,0,c,3,3);p(13,0,c,3,3);p(0,13,c,3,3);p(13,13,c,3,3)}
 else{p(1,4,d,14,9);p(1,4,c,14,7);p(1,4,'rgba(255,255,255,.35)',14,1);p(4,7,DK,8,1);p(5,9,DK,6,1)}}]
];

const app=document.getElementById('app');
CATS.forEach(([name,n,fn],ci)=>{
 const h=document.createElement('h2');h.innerHTML=name+'<span>20 von '+n+'</span>';app.appendChild(h);
 const g=document.createElement('div');g.className='g';app.appendChild(g);
 for(let i=0;i<20;i++){
  const d=document.createElement('div');d.className='c';
  const cv=document.createElement('canvas');cv.width=cv.height=64;
  const x=cv.getContext('2d');x.imageSmoothingEnabled=false;
  const p=(a,b,k,w=1,h=1)=>{x.fillStyle=k;x.fillRect(a*4,b*4,w*4,h*4)};
  if(ci>=3)p(0,0,BG,16,16);
  try{fn(p,i,rng(ci*100+i+1))}catch(e){}
  cv.onclick=()=>{const a=document.createElement('a');a.download=name.toLowerCase()+'_'+String(i+1).padStart(2,'0')+'.png';a.href=cv.toDataURL();a.click()};
  d.appendChild(cv);g.appendChild(d);
 }
});
const t=document.getElementById('t');
t.onclick=()=>{const l=document.body.classList.toggle('leer');t.textContent=l?'Grafiken einblenden':'Nur leeres Gitter zeigen'};
</script>
</body>
</html>
